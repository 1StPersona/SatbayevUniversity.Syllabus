# Электронный силлабус + УМКД: MS SQL Server + API (.NET 8) + Angular (nginx).
# Запуск:  cp .env.example .env  (задать пароли/ключи)  &&  docker compose up -d --build
name: satbayev-syllabus

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Задайте MSSQL_SA_PASSWORD в .env}
      MSSQL_PID: ${MSSQL_PID:-Developer}
      TZ: Asia/Almaty
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    build: ./backend
    image: satbayev-syllabus-api:latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${API_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Server=mssql,1433;Database=SatbayevSyllabus;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Задайте JWT_SIGNING_KEY в .env (не короче 32 символов)}
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@esyllabus.local}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-}
      Seed__DemoData: ${SEED_DEMO_DATA:-false}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      Cors__Origins__0: ${PUBLIC_URL:-http://localhost:8080}
    volumes:
      - umkd-files:/app/App_Data/umkd
      - api-logs:/app/logs
    restart: unless-stopped

  web:
    build: ./frontend
    image: satbayev-syllabus-web:latest
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  mssql-data:
  umkd-files:
  api-logs:
