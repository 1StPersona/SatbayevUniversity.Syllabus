server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Файлы УМКД до 50 МБ + запас на multipart
    client_max_body_size 60m;

    # Журналы в stdout/stderr контейнера (docker logs)
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health { proxy_pass http://api:8080/health; }
    location /swagger { proxy_pass http://api:8080; }

    # Статика с хэшами в именах — долгий кэш
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: все маршруты Angular отдают index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
